name: LinkedIn daily technical post

on:
  schedule:
    # Poll every 30 minutes so the user-configured local time can be read from
    # automation/autopost-config.json without editing this workflow.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo generar el texto e imagen; no publicar en LinkedIn'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: linkedin-publisher-production
  cancel-in-progress: false

jobs:
  generate-and-publish:
    # SCHEDULER_MODE=backend belongs to the hosted backend; all app-side GHA
    # behavior is additionally gated by the repository config file.
    if: vars.PUBLICATION_MODE != 'backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'

      - name: Generate post and image
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          LINKEDIN_PERSON_URN: ${{ vars.LINKEDIN_PERSON_URN }}
          LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}
          NANOGPT_KEY: ${{ secrets.NANOGPT_KEY }}
          USER_NICHE_PROMPT: ${{ vars.USER_NICHE_PROMPT }}
          NANOGPT_IMAGE_MODEL: ${{ vars.NANOGPT_IMAGE_MODEL }}
          NANOGPT_IMAGE_SIZE: ${{ vars.NANOGPT_IMAGE_SIZE }}
          NANOGPT_IMAGE_RESOLUTION: ${{ vars.NANOGPT_IMAGE_RESOLUTION }}
          NANOGPT_IMAGE_ASPECT_RATIO: ${{ vars.NANOGPT_IMAGE_ASPECT_RATIO }}
          AUTOPOST_PREVIEW_PATH: ${{ runner.temp }}/autopost-preview.png
          REQUIRE_IMAGE: 'true'
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202609' }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUEUE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_DRY_RUN" == "true" ]]; then
            python scripts/autopost.py --dry-run
          else
            python scripts/autopost.py
          fi

      - name: Attach image preview to manual dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: autopost-image-preview
          path: ${{ runner.temp }}/autopost-preview.png
          if-no-files-found: error
