name: Publish exported queue (no server)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linkedin-publisher-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish reviewed export
        run: python3 scripts/publish_queue.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUEUE_BRANCH: ${{ github.event.repository.default_branch }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          PUBLICATION_TIMEZONE: ${{ vars.PUBLICATION_TIMEZONE }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
          PUBLICATION_MODE: ${{ vars.PUBLICATION_MODE }}
