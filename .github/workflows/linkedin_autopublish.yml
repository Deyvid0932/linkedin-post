name: LinkedIn Autonomous Publisher Agent

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      custom_prompt:
        description: 'Prompt de nicho o tema personalizado (dejar vacio para auto-detectar)'
        required: false
        type: string
        default: ''
      force_text_only:
        description: 'Forzar publicacion de solo texto (sin imagen)'
        required: false
        type: boolean
        default: false

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Agente Autónomo
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NANOGPT_KEY: ${{ secrets.NANOGPT_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          USER_NICHE_PROMPT: ${{ inputs.custom_prompt != '' && inputs.custom_prompt || secrets.USER_NICHE_PROMPT }}
          FORCE_TEXT_ONLY: ${{ inputs.force_text_only }}
        run: python scripts/auto_linkedin_agent.py