name: LinkedIn Autonomous Publisher Agent

on:
  schedule:
    # Lunes a viernes a las 13:00 UTC (08:00 AM hora Perú/Colombia/Ecuador/México)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en la pestaña Actions

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Agente Autónomo
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          USER_NICHE_PROMPT: ${{ secrets.USER_NICHE_PROMPT }}
        run: python scripts/auto_linkedin_agent.py