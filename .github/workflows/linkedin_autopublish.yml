name: Publish approved LinkedIn queue
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linkedin-approved-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: vars.PUBLICATION_MODE == 'backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ask the backend to process due schedules
        env:
          AUTOMATION_API_URL: ${{ vars.AUTOMATION_API_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: python3 scripts/run_due_publications.py
