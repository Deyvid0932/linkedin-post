services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: linkedin_saas_postgres
    restart: always
    environment:
      POSTGRES_DB: linkedin_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
