spring:
  application:
    name: linkedin-automation-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/linkedin_automation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: SaaSLinkedInScheduler
      org.quartz.threadPool.threadCount: 10
      org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:${LLM_API_KEY:}}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  scheduler:
    mode: ${SCHEDULER_MODE:manual}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  security:
    encryption-key: ${ENCRYPTION_KEY}
    allow-legacy-encryption-key: ${ALLOW_LEGACY_ENCRYPTION_KEY:false}

  automation:
    token: ${AUTOMATION_TOKEN:}
    tenant-id: ${AUTOMATION_TENANT_ID:}

  vision:
    base-url: ${VISION_BASE_URL:}
    api-key: ${VISION_API_KEY:}
    model: ${VISION_MODEL:}

  email:
    from: ${MAIL_FROM:noreply@saas-linkedin.com}

  github:
    api-base-url: https://api.github.com

  linkedin:
    api-base-url: ${LINKEDIN_API_BASE_URL:https://api.linkedin.com}
    api-version: ${LINKEDIN_API_VERSION:202607}
    oauth:
      client-id: ${LINKEDIN_CLIENT_ID:}
      client-secret: ${LINKEDIN_CLIENT_SECRET:}
      redirect-uri: ${LINKEDIN_OAUTH_REDIRECT_URI:https://localhost:8443/api/v1/credentials/linkedin/oauth/callback}
      frontend-url: ${FRONTEND_BASE_URL:http://localhost:4200}
      secure-cookie: ${LINKEDIN_OAUTH_SECURE_COOKIE:true}

  llm:
    api-key: ${DEEPSEEK_API_KEY:${LLM_API_KEY:}}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    model: ${LLM_MODEL:deepseek-chat}
