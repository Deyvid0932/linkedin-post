spring:
  application:
    name: linkedin-automation-backend

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.chat.observation.ChatObservationAutoConfiguration
      - org.springframework.ai.autoconfigure.image.observation.ImageObservationAutoConfiguration
      - org.springframework.ai.autoconfigure.vectorstore.observation.VectorStoreObservationAutoConfiguration

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/linkedin_automation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: SaaSLinkedInScheduler
      org.quartz.threadPool.threadCount: 10
      org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:${LLM_API_KEY:}}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
    expiration-ms: 86400000

  security:
    encryption-key: ${ENCRYPTION_KEY:MySuperSecretEncryptionKey32Chars!}

  email:
    from: ${MAIL_FROM:noreply@saas-linkedin.com}

  github:
    api-base-url: https://api.github.com

  linkedin:
    api-base-url: ${LINKEDIN_API_BASE_URL:https://api.linkedin.com}
    api-version: ${LINKEDIN_API_VERSION:202607}

  llm:
    api-key: ${DEEPSEEK_API_KEY:${LLM_API_KEY:}}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    model: ${LLM_MODEL:deepseek-chat}
