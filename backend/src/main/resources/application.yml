spring:
  application:
    name: linkedin-automation-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linkedin_automation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: SaaSLinkedInScheduler
      org.quartz.threadPool.threadCount: 10
      org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - email
              - profile
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:linkedin-client-id-placeholder}
            client-secret: ${LINKEDIN_CLIENT_SECRET:linkedin-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
              - w_member_social

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:openai-api-key-placeholder}
      chat:
        options:
          model: gpt-4o

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
    expiration-ms: 86400000 # 24 horas

  security:
    encryption-key: ${ENCRYPTION_KEY:MySuperSecretEncryptionKey32Chars!}

  email:
    from: ${MAIL_FROM:noreply@saas-linkedin.com}

  github:
    api-base-url: https://api.github.com

  linkedin:
    api-base-url: https://api.linkedin.com
