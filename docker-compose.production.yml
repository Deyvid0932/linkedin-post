services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkedin_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Define DB_ADMIN_PASSWORD}
      DB_APP_USER: ${DB_USERNAME:?Define DB_USERNAME}
      DB_APP_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - production_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/app.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/linkedin_automation
      DB_USERNAME: ${DB_USERNAME:?Define DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY}
      ALLOW_LEGACY_ENCRYPTION_KEY: ${ALLOW_LEGACY_ENCRYPTION_KEY:-false}
      SCHEDULER_MODE: ${SCHEDULER_MODE:-actions}
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:-}
      AUTOMATION_TENANT_ID: ${AUTOMATION_TENANT_ID:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_OAUTH_REDIRECT_URI: ${LINKEDIN_OAUTH_REDIRECT_URI:-https://localhost:8443/api/v1/credentials/linkedin/oauth/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      LINKEDIN_OAUTH_SECURE_COOKIE: ${LINKEDIN_OAUTH_SECURE_COOKIE:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NANOGPT_API_KEY: ${NANOGPT_API_KEY:-${NANOGPT_KEY:-}}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports: ['127.0.0.1:8088:8080']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
volumes:
  production_pgdata:
