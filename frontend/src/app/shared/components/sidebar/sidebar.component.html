<aside class="app-sidebar">
  <a routerLink="/dashboard" class="app-brand" (click)="onNavClick()">
    <span class="app-brand-mark" aria-hidden="true">A</span><strong>AutoPost</strong>
  </a>
  <a routerLink="/compose" (click)="onNavClick()" class="app-new-post">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>Nueva publicación
  </a>
  <nav id="primary-navigation" aria-label="Navegación principal" class="app-nav">
    @for(link of links; track link.route) {
      <a [routerLink]="link.route" (click)="onNavClick()" [class.app-nav-link--active]="isActive(link.route)" [attr.aria-current]="isActive(link.route) ? 'page' : null" class="app-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="link.icon" /></svg>{{ link.label }}
      </a>
    }
    <section class="app-channel-shortcuts" aria-label="Canales">
      <h2>Canales</h2>
      <div>
        <a routerLink="/settings/channels" (click)="onNavClick()" class="app-channel-icon app-channel-icon--linkedin" aria-label="Gestionar LinkedIn" title="LinkedIn">in</a>
        <a routerLink="/settings/channels" (click)="onNavClick()" class="app-channel-add" aria-label="Conectar un canal" title="Conectar un canal">+</a>
      </div>
    </section>
  </nav>
  <footer class="app-sidebar-footer">
    <button type="button" class="app-profile-trigger" [attr.aria-expanded]="profileOpen()" aria-controls="profile-options" (click)="toggleProfileMenu()">
      <span class="app-avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="app-profile-copy"><strong>{{ user()?.name || 'Mi cuenta' }}</strong><small>Mi espacio</small></span>
      <svg class="app-profile-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path [attr.d]="profileOpen() ? 'm5 12.5 5-5 5 5' : 'm7.5 5 5 5-5 5'" /></svg>
    </button>
    @if(profileOpen()) {
      <div id="profile-options" class="app-profile-menu" aria-label="Opciones de cuenta">
        <div class="app-profile-menu-heading"><strong>{{ user()?.name || 'Mi cuenta' }}</strong><span>{{ user()?.email }}</span></div>
        <a routerLink="/settings/profile" (click)="onNavClick()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6" /></svg>Settings</a>
        <a routerLink="/how-it-works" (click)="onNavClick()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9 8a3 3 0 1 1 5 2c-2 1-2 2-2 3m0 4v.1" /></svg>Help</a>
        <button type="button" (click)="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 4H4v16h5m-1-8h13m-5-5 5 5-5 5" /></svg>Log out</button>
      </div>
    }
  </footer>
</aside>
